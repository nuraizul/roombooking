<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RoomFlow · Log in</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
      body{background:#0f1b2e;min-height:100vh;display:grid;place-items:center;padding:20px;margin:0}
      .login-card{background:#fff;border-radius:16px;width:100%;max-width:380px;padding:30px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
      .login-card .brand-mark{width:44px;height:44px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:20px;margin-bottom:14px}
      .login-card h1{font-size:20px;margin-bottom:4px}
      .login-card p.sub{color:var(--muted);font-size:12px;margin-bottom:18px;line-height:1.5}
      .login-card .field{margin-bottom:12px}
      .login-card .btn.primary{width:100%;justify-content:center;height:40px;margin-top:4px}
    </style>
</head>
<body>
<div class="login-card">
  <div class="brand-mark"><i class="fa-solid fa-calendar-check"></i></div>
  <div id="form-area"></div>
</div>
<script>
(function () {
  const area = document.getElementById('form-area');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const post = (url, body) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(async r => { const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'Request failed'); return d; });

  function loginForm() {
    area.innerHTML = `<h1>Log in</h1><p class="sub">Use your RoomFlow account to manage rooms and bookings.</p>
      <form id="f" novalidate>
        <div class="field"><label>Email</label><input type="email" name="email" required autocomplete="username"></div>
        <div class="field"><label>Password</label><input type="password" name="password" required autocomplete="current-password"></div>
        <div class="form-error" id="err"></div>
        <button class="btn primary" type="submit">Log in</button>
      </form>`;
    document.getElementById('f').onsubmit = async e => {
      e.preventDefault();
      const f = e.target; const err = document.getElementById('err'); err.textContent = '';
      try { await post('/api/auth/login', { email: f.email.value, password: f.password.value }); location.href = 'index.html'; }
      catch (ex) { err.textContent = ex.message; }
    };
  }

  function setupForm() {
    area.innerHTML = `<h1>Create administrator</h1><p class="sub">No account exists yet. Create the first Administrator to start using RoomFlow. You can add other users later.</p>
      <form id="f" novalidate>
        <div class="field"><label>Full name</label><input name="name" required></div>
        <div class="field"><label>Email</label><input type="email" name="email" required></div>
        <div class="field"><label>Password (min 8 characters)</label><input type="password" name="password" required minlength="8" autocomplete="new-password"></div>
        <div class="form-error" id="err"></div>
        <button class="btn primary" type="submit">Create and log in</button>
      </form>`;
    document.getElementById('f').onsubmit = async e => {
      e.preventDefault();
      const f = e.target; const err = document.getElementById('err'); err.textContent = '';
      try { await post('/api/auth/setup', { name: f.name.value, email: f.email.value, password: f.password.value }); location.href = 'index.html'; }
      catch (ex) { err.textContent = ex.message; }
    };
  }

  fetch('/api/auth/status').then(r => r.json()).then(d => {
    if (d.needs_setup) setupForm(); else loginForm();
  }).catch(() => { area.innerHTML = `<h1>Cannot reach server</h1><p class="sub">Check that RoomFlow is running.</p>`; });
})();
</script>
</body>
</html>
